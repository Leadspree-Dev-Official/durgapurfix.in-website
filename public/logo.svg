<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" width="1000" height="700">
  <rect width="1000" height="700" fill="#ffffff" rx="32"/>
  <g transform="translate(100, 50)">
    <!-- Outer Navy Location Pin Base -->
    <path d="M 230 40 C 130 40 60 110 60 210 C 60 290 130 360 230 440 L 230 440 Z" fill="#0B2038" />

    <!-- Inner White Shield Cutout -->
    <path d="M 230 70 C 150 70 95 125 95 205 C 95 270 150 330 230 395 C 230 395 240 380 250 360 C 230 360 150 280 150 200 C 150 140 185 95 230 95 Z" fill="#FFFFFF" />

    <!-- Industrial Skyline in Navy -->
    <g fill="#0B2038">
      <rect x="135" y="220" width="110" height="70" rx="2" />
      <rect x="150" y="180" width="35" height="110" rx="2" />
      <rect x="165" y="235" width="12" height="12" fill="#FFFFFF" />
      <rect x="185" y="235" width="12" height="12" fill="#FFFFFF" />
      <rect x="205" y="235" width="12" height="12" fill="#FFFFFF" />
      <rect x="165" y="255" width="12" height="12" fill="#FFFFFF" />
      <rect x="185" y="255" width="12" height="12" fill="#FFFFFF" />
      <rect x="205" y="255" width="12" height="12" fill="#FFFFFF" />
      <rect x="180" y="115" width="16" height="70" />
      <rect x="180" y="125" width="16" height="8" fill="#DC2626" />
      <rect x="180" y="141" width="16" height="8" fill="#DC2626" />
      <rect x="220" y="175" width="22" height="24" rx="4" />
      <path d="M 223 199 L 218 240 M 239 199 L 244 240 M 220 220 L 242 220" stroke="#0B2038" stroke-width="3" />
      <path d="M 245 155 Q 265 155 265 210 L 265 290" fill="none" stroke="#0B2038" stroke-width="12" stroke-linecap="round" />
      <path d="M 210 110 Q 215 105 220 110 Q 225 105 230 110" fill="none" stroke="#0B2038" stroke-width="3" stroke-linecap="round" />
      <path d="M 235 90 Q 240 85 245 90 Q 250 85 255 90" fill="none" stroke="#0B2038" stroke-width="3" stroke-linecap="round" />
    </g>

    <!-- Right & Bottom Orange Wrench Curve -->
    <path d="M 230 40 C 290 40 330 80 330 135 C 330 155 295 155 275 155 C 275 180 280 260 205 350 L 240 440 C 340 330 380 250 380 145 C 380 80 320 40 230 40 Z" fill="#F97316" />
    <path d="M 230 440 L 205 350 C 230 390 240 410 240 440 Z" fill="#F97316" />
    <circle cx="230" cy="380" r="18" fill="#FFFFFF" />
  </g>

  <!-- Brand Text -->
  <g transform="translate(50, 520)">
    <text x="450" y="40" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="78" letter-spacing="-1">
      <tspan fill="#0B2038">DURGAPUR </tspan>
      <tspan fill="#F97316">FIX</tspan>
    </text>
    
    <!-- Tagline Divider & Text -->
    <line x1="50" y1="85" x2="160" y2="85" stroke="#F97316" stroke-width="3" stroke-linecap="round"/>
    <text x="450" y="93" text-anchor="middle" fill="#0B2038" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="24" letter-spacing="6">
      FIND <tspan fill="#F97316">•</tspan> CONNECT <tspan fill="#F97316">•</tspan> GET IT FIXED
    </text>
    <line x1="740" y1="85" x2="850" y2="85" stroke="#F97316" stroke-width="3" stroke-linecap="round"/>
  </g>
